# The harness's usual POST as a one-request scenario. The harness replaces
# 172.18.0.2 and writes the result beside the run's records.
target: http://172.18.0.2:8080
requests:
  - name: work
    method: POST
    path: /work
    headers:
      Content-Type: application/json
      Accept-Encoding: identity
    body_file: /bench/body.json
