# Master は TUI 付き、Worker は replicas で台数指定
# 起動: docker compose up -d --build  （-d でバックグラウンド、ターミナルが空く）
# 停止: docker compose down
# TUI 操作: docker attach $(docker compose ps -q master)  → s 開始 / q 終了 / Ctrl+P,Ctrl+Q でデタッチ
#
# 別 URL で負荷テストする: 環境変数で上書き可能
#   TARGET_URL=https://your-api.example.com TOTAL_REQUESTS=100 CONCURRENCY=10 docker compose up -d --build
#  または .env に TARGET_URL=... を書く

services:
  # テスト用のダミーサーバー
  target-server:
    image: ealen/echo-server
    
    networks:
      - swarm-net

  # 司令塔サーバー（TUI 付き。attach で s=開始, q=終了）
  master:
    build: .
    command: ["master", "-p", "50051"]
    environment:
      # デフォルトのターゲットを、上のダミーサーバー (http://target-server) に向ける
      - TARGET_URL=${TARGET_URL:-http://target-server}
      
      - TOTAL_REQUESTS=${TOTAL_REQUESTS:-3000}
      
      - CONCURRENCY=${CONCURRENCY:-10}
    ports:
      - "50051:50051"
    stdin_open: true  # TUI のために標準入力を開ける
    tty: true         # TUI のために擬似端末を割り当てる
    depends_on:
      - target-server # ダミーサーバーが起動してからMasterを起動する
    networks:
      - swarm-net

  # Worker（replicas を変えれば台数を変更可能）
  worker:
    build: .
    command: ["worker"]
    deploy:
      replicas: 3
    restart: always
    environment:
      - MASTER_ADDR=master:50051
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    depends_on:
      - master
    networks:
      - swarm-net

networks:
  swarm-net:
    driver: bridge
