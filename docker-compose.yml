# Start: docker compose up -d --build
# Stop: docker compose down
# TUI: docker attach $(docker compose ps -q master)
# Press s to start, q to quit, or Ctrl+P then Ctrl+Q to detach.
#
# Override the target only when you own it or have permission to test it.
#   TARGET_URL=https://your-api.example.com TOTAL_REQUESTS=100 CONCURRENCY=10 docker compose up -d --build
# Or put TARGET_URL=... in a local .env file.

services:
  target-server:
    image: ealen/echo-server
    
    networks:
      - swarm-net

  master:
    build: .
    command: ["master", "-p", "50051"]
    environment:
      - TARGET_URL=${TARGET_URL:-http://target-server}
      
      - TOTAL_REQUESTS=${TOTAL_REQUESTS:-3000}
      
      - CONCURRENCY=${CONCURRENCY:-10}
    ports:
      - "50051:50051"
    stdin_open: true
    tty: true
    depends_on:
      - target-server
    networks:
      - swarm-net

  worker:
    build: .
    command: ["worker"]
    deploy:
      replicas: 3
    restart: always
    environment:
      - MASTER_ADDR=master:50051
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    depends_on:
      - master
    networks:
      - swarm-net

networks:
  swarm-net:
    driver: bridge
