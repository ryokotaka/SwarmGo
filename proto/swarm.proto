syntax = "proto3";

package proto;

option go_package = "github.com/ryokotaka/SwarmGo/proto";

// 1. Worker -> Master への登録・報告するために
service SwarmService {
  // WorkerがMasterに接続し、双方向ストリーミングを開始する
  //
  // この1行で「何を流すストリームか」を宣言している。
  // Go では gRPC ライブラリが stream.Send() / stream.Recv() を提供し、
  // ここで宣言した型（WorkerMsg / MasterCmd）がその送受信の対象になる。
  // ・クライアント(Worker) → stream.Send(WorkerMsg), stream.Recv() で MasterCmd を受信
  // ・サーバー(Master)  → stream.Send(MasterCmd), stream.Recv() で WorkerMsg を受信
  rpc Connect (stream WorkerMsg) returns (stream MasterCmd);
}

// タグ番号（= 1, = 2, = 3 の数字）について:
// ・ネットワークにはフィールド名ではなく「タグ番号＋値」だけが送られる
// ・受信側は同じ .proto の対応表（1=start, 2=stop, 3=quit など）でどのフィールドか判断する
// ・同じ message 内で番号を重複させず、一度決めた番号は変えない（互換性のため）

// MasterからWorkerへの命令
//
// oneof の「start」「stop」「quit」はフィールド名（どの種類の命令か）。
// 「StartCmd」「StopCmd」「QuitCmd」はその中身の型（具体的なデータの形）。
// MasterCmd のタグ 1 = start を選んだとき、その中身が StartCmd。
// StartCmd の中にはさらにタグ 1,2,3がある。
message MasterCmd {
  oneof cmd {
    StartCmd start = 1; // テスト開始命令（ワイヤ上では「タグ1」として送られる）
    StopCmd stop = 2;   // テスト停止命令（タグ2）
    QuitCmd quit = 3;   // アプリ終了命令（タグ3）
  }
}

// WorkerからMasterへのメッセージ
//
// MasterCmd と同様、oneof の「register」「stats」「finish」が種類の名前、
// 「RegisterMsg」「StatsMsg」「FinishMsg」がその中身の型。
message WorkerMsg {
  oneof msg {
    RegisterMsg register = 1; // 最初の挨拶（スペック情報など）（ワイヤ上ではタグ1）
    StatsMsg stats = 2;       // 途中経過（RPSなど）（タグ2）
    FinishMsg finish = 3;     // 完了報告（タグ3）
  }
}

// 以下は MasterCmd / WorkerMsg の oneof の「中身」を定義している。
// どの種類かは上の oneof のタグ（1,2,3）で区別し、ここでその種類ごとのフィールドを定義する。
//
message StartCmd {
  string target_url = 1;      // タグ1 → 受信側で TargetUrl に復元される
  int32 total_requests = 2;   // Workerごとの割当量
  int32 concurrency = 3;      // タグ3
}

message StopCmd {}   // 中身なし。停止の印だけ
message QuitCmd {}   // 中身なし。終了の印だけ

message RegisterMsg {
  string worker_id = 1;  // Worker の初回挨拶で送る ID
  string cpu_arch = 2;   // "arm64", "amd64" などのデバッグ用に
}

message StatsMsg {
  int32 success_count = 1;  // 途中報告：成功数
  int32 fail_count = 2;     // 途中報告：失敗数
  double current_rps = 3;   // リアルタイムRPS
  int32 latency_p50_ms = 4; // レイテンシ P50（ミリ秒、成功リクエストのみ）
  int32 latency_p90_ms = 5; // レイテンシ P90（ミリ秒）
  int32 latency_p99_ms = 6; // レイテンシ P99（ミリ秒）
}

message FinishMsg {
  int32 total_duration_ms = 1;  // 完了報告：所要時間（ミリ秒）
}
